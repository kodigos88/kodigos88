<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;800;900&amp;family=Space+Grotesk:wght@700;900&amp;display=swap');
      .title { font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 900; font-size: 42px; fill: #FFFFFF; letter-spacing: -1px; }
      .tag { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 800; fill: #000000; letter-spacing: 1.5px; }
      .desc { font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 500; fill: #A3A3A3; }
      .accent { fill: #FFE600; }
      .badge-bg { fill: #FFE600; }
      .pill { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 800; fill: #FFFFFF; }
      .shadow-box { fill: #FFE600; }
      .main-box { fill: #0A0A0C; stroke: #FFE600; stroke-width: 3; }
    </style>
  </defs>

  <!-- Neo-Brutalist Hard Drop Shadow -->
  <rect x="14" y="14" width="872" height="212" fill="#FFE600" rx="0" />

  <!-- Main Container -->
  <rect x="8" y="8" width="872" height="212" fill="#0D0D11" stroke="#FFFFFF" stroke-width="3" rx="0" />

  <!-- Header Badge -->
  <rect x="40" y="36" width="220" height="26" fill="#FFE600" />
  <text x="48" y="54" class="tag">⚡ DEV_ENVIRONMENT // V4.6</text>

  <!-- Available for Work Pill -->
  <rect x="670" y="36" width="170" height="26" fill="#18181B" stroke="#22C55E" stroke-width="2" />
  <circle cx="686" cy="49" r="4" fill="#22C55E" />
  <text x="700" y="54" class="pill" fill="#22C55E">STATUS: ACTIVE</text>

  <!-- Title -->
  <text x="40" y="112" class="title">ARTURO TOVAR <tspan class="accent">//</tspan> KODIGOS88</text>

  <!-- Subtitle -->
  <text x="40" y="148" class="desc">SENIOR WEB DEVELOPER • WOOCOMMERCE &amp; BESPOKE APPS • LINUX &amp; AGENTS</text>

  <!-- Bottom Details -->
  <line x1="40" y1="172" x2="840" y2="172" stroke="#262626" stroke-width="2" />
  
  <text x="40" y="196" class="tag" fill="#FFE600" style="fill: #FFE600;">PORTFOLIO:</text>
  <text x="145" y="196" class="tag" fill="#FFFFFF" style="fill: #FFFFFF;">CODIGOSATDEV.COM</text>
  
  <text x="440" y="196" class="tag" fill="#FFE600" style="fill: #FFE600;">PHILOSOPHY:</text>
  <text x="550" y="196" class="tag" fill="#FFFFFF" style="fill: #FFFFFF;">DETERMINISTIC &amp; ZERO-SLOP</text>
</svg>
